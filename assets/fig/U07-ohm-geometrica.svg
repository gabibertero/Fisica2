    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#286b62"/>
    </marker>
  </defs>
  <rect width="720" height="260" rx="16" fill="#f5f2ec"/>
  <text x="30" y="42" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d1b18">Conductor uniforme</text>
  <path d="M150 93h420v90H150z" fill="#d9e8e3" stroke="#1d1b18" stroke-width="3"/>
  <ellipse cx="150" cy="138" rx="25" ry="45" fill="#c4ddd5" stroke="#1d1b18" stroke-width="3"/>
  <ellipse cx="570" cy="138" rx="25" ry="45" fill="#a9cec3" stroke="#1d1b18" stroke-width="3"/>
  <path d="M210 128h110M350 128h110" stroke="#286b62" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="324" y="115" font-family="sans-serif" font-size="18" fill="#1d1b18">E, J, I</text>
  <path d="M150 210v17M570 210v17M158 221h404" stroke="#1d1b18" stroke-width="2"/>
  <path d="m158 221 12-6v12zM562 221l-12-6v12z" fill="#1d1b18"/>
  <text x="355" y="250" font-family="sans-serif" font-size="19" fill="#1d1b18">L</text>
  <text x="74" y="143" font-family="sans-serif" font-size="18" fill="#1d1b18">A</text>
  <text x="614" y="133" font-family="sans-serif" font-size="16" fill="#1d1b18">ΔV</text>
  <text x="615" y="157" font-family="sans-serif" font-size="14" fill="#1d1b18">R = ρL/A</text>
</svg>
