<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Conductor uniforme y ley de Ohm geométrica</title>
  <desc id="desc">Cilindro de longitud L y sección A, con campo eléctrico E y corriente I dirigidos hacia la derecha.</desc>
