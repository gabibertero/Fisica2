<text x="320" y="300" text-anchor="middle" font-size="15" fill="#111">dB y dB': las componentes ⟂ al eje se cancelan; las axiales (dB·senα) se suman</text>
<text x="320" y="324" text-anchor="middle" font-size="15" fill="#111">senα = R/√(R²+x²)  →  B = μ₀IR² / [2(R²+x²)<tspan baseline-shift="super" font-size="11">3/2</tspan>]</text>
