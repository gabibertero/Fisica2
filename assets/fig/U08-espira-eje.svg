<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Instrument Sans, Arial, sans-serif" font-size="16" role="img" aria-label="Espira de radio R vista de canto con campo B sobre el eje a distancia x">
