<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Barra móvil con resistencia y fuerzas</title>
  <desc id="desc">Una barra conductora se mueve a la derecha sobre rieles en un campo magnético entrante; una resistencia cierra el circuito y la fuerza magnética se opone al movimiento.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#286b62"/>
    </marker>
    <marker id="force" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#c6532d"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#f5f2ec"/>
  <text x="28" y="36" font-family="sans-serif" font-size="20" font-weight="700" fill="#1d1b18">Fem de movimiento y balance de potencia</text>
  <g stroke="#8791a2" stroke-width="2">
    <path d="M150 90v160M220 90v160M290 90v160M360 90v160M430 90v160M500 90v160"/>
    <path d="M150 90h430M150 250h430"/>
  </g>
  <g fill="#526078" font-family="sans-serif" font-size="23">
    <text x="182" y="147">×</text><text x="252" y="147">×</text><text x="322" y="147">×</text>
    <text x="182" y="218">×</text><text x="252" y="218">×</text><text x="322" y="218">×</text>
  </g>
  <path d="M430 90v160" stroke="#c6532d" stroke-width="8"/>
  <text x="438" y="109" font-family="sans-serif" font-size="17" font-weight="700" fill="#c6532d">+</text>
  <text x="437" y="177" font-family="sans-serif" font-size="17" fill="#1d1b18">ℓ</text>
  <path d="M430 90h90v57" fill="none" stroke="#1d1b18" stroke-width="3"/>
  <path d="M510 158l-10 8 20 12-20 12 20 12-10 8" fill="none" stroke="#1d1b18" stroke-width="3"/>
  <path d="M510 218v32h-80" fill="none" stroke="#1d1b18" stroke-width="3"/>
  <text x="526" y="188" font-family="sans-serif" font-size="17" fill="#1d1b18">R</text>
  <path d="M333 123h72" stroke="#286b62" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="358" y="112" font-family="sans-serif" font-size="18" fill="#1d1b18">v</text>
  <path d="M430 174h-63" stroke="#c6532d" stroke-width="3" marker-end="url(#force)"/>
  <text x="370" y="166" font-family="sans-serif" font-size="16" fill="#1d1b18">F<tspan baseline-shift="sub" font-size="12">B</tspan></text>
  <path d="M430 204h63" stroke="#286b62" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="229" font-family="sans-serif" font-size="16" fill="#1d1b18">F<tspan baseline-shift="sub" font-size="12">ext</tspan></text>
  <text x="30" y="286" font-family="sans-serif" font-size="17" fill="#1d1b18">B entrante (×) · a velocidad constante: |F<tspan baseline-shift="sub" font-size="12">ext</tspan>|=|F<tspan baseline-shift="sub" font-size="12">B</tspan>|</text>
</svg>
